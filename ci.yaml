# YAML version of the classic "MvvmScarletToolkit-CI" pipeline (definition 2, revision 71).
#
# Secrets are not stored here. They come from the variable group "MvvmScarletToolkit-Secrets"
# (Pipelines > Library), marked as secret, with this pipeline allowed under "Pipeline permissions":
#   CODECOV_TOKEN    - coverage upload (UploadCodecovReport), mapped in the Test job
#   GITHUB_APIKEY    - push pre-release packages to GitHub Packages (PushGithub), mapped in the Publish job
#   NUGETORG_APIKEY  - not mapped here, so PushNuget can't run in CI
# Secret variables are not exposed to scripts automatically, so they are mapped through `env` below.
# Both must be defined: an undefined $(NAME) is passed on as the literal text "$(NAME)",
# which the Cake ShouldRun checks treat as a set key.
#
# Fork builds are disabled in the classic definition. That is a pipeline setting, not YAML:
# Pipelines > Edit > Triggers > Pull request validation > "Build pull requests from forks".

trigger:
  batch: true
  branches:
    include:
      - dev
    exclude:
      - pages
  paths:
    exclude:
      # Cake never builds the samples, it only builds tests and package projects
      - samples
      - .vscode
      - .editorconfig
      - .gitattributes
      - .gitignore
      - .vsconfig
      - codecov.yml
      - LICENSE.md
      - MvvmScarletToolkit.ruleset
      - README.md

pr:
  branches:
    include:
      - dev

pool:
  vmImage: windows-latest

variables:
  - group: MvvmScarletToolkit-Secrets
  - name: BuildConfiguration
    value: Release
  - name: DOTNET_NOLOGO
    value: 'true'
  - name: DOTNET_CLI_TELEMETRY_OPTOUT
    value: 'true'
  - name: DOTNET_SKIP_FIRST_TIME_EXPERIENCE
    value: 'true'
  # NuGet's global packages folder, restored and saved by the Cache@2 step of each job.
  # Also used by "dotnet tool restore" and the Cake build itself
  - name: NUGET_PACKAGES
    value: $(Pipeline.Workspace)/.nuget/packages

# Test, Pack and the Native AOT jobs run at the same time on separate agents, Publish only pushes once all of them succeeded.
# The Cake targets RunTests, CreatePackages and PushPackages split the Default target the same way.
#
# There are no UseDotNet steps: the hosted Windows image already has the .NET 10 SDK, which global.json asks for,
# and the .NET 8 runtimes for the net8.0(-windows) test runs. Installing them took about 50 seconds per job.
jobs:
  - job: Test
    displayName: Test
    steps:
      - checkout: self
        # Nerdbank.GitVersioning and GitVersion compute the version from the history,
        # YAML pipelines clone shallow by default
        fetchDepth: 0
        fetchTags: true

      # Restoring took about 1 minute per job on a fresh agent. One cache per job, the Test job also needs the test packages.
      # There are no lock files, the key hashes everything that decides which packages are restored.
      # A changed key starts from the last cache of the job (restoreKeys), restore adds what's missing and the job saves it under the new key.
      - task: Cache@2
        displayName: Cache NuGet packages
        inputs:
          key: 'nuget | "$(Agent.OS)" | Test | Directory.Packages.props | .config/dotnet-tools.json | global.json | **/*.csproj'
          restoreKeys: |
            nuget | "$(Agent.OS)" | Test
          path: $(NUGET_PACKAGES)

      # builds and runs the tests, publishes their trx results through ##vso[results.publish] and uploads the coverage to Codecov
      - task: PowerShell@2
        displayName: Test with Cake
        inputs:
          targetType: filePath
          filePath: ./build.ps1
          arguments: --target=RunTests
          errorActionPreference: stop
          pwsh: false
        env:
          CODECOV_TOKEN: $(CODECOV_TOKEN)

      # The classic pipeline also had a "Publish Test Results" step for **/results/coverage/*.trx.
      # It never matched anything: the trx files are written to results/tests and the Cake task
      # PublishTestResults already publishes them through ##vso[results.publish]. Dropped here.

      # Fills the "Code Coverage" tab. Cake merges the coverage of all test runs into this file and only uploads it to Codecov.
      # Also after failed tests, Cake writes the report before it fails the build for them.
      - task: PublishCodeCoverageResults@2
        displayName: Publish code coverage
        condition: succeededOrFailed()
        inputs:
          summaryFileLocation: results/reports/cobertura/Cobertura.xml
          failIfCoverageEmpty: false

  - job: Pack
    displayName: Pack
    steps:
      - checkout: self
        fetchDepth: 0
        fetchTags: true

      # see the Test job
      - task: Cache@2
        displayName: Cache NuGet packages
        inputs:
          key: 'nuget | "$(Agent.OS)" | Pack | Directory.Packages.props | .config/dotnet-tools.json | global.json | **/*.csproj'
          restoreKeys: |
            nuget | "$(Agent.OS)" | Pack
          path: $(NUGET_PACKAGES)

      # without PublicRelease, so packages get a pre-release version. Packs all packages in one parallel build and validates their symbols
      - task: PowerShell@2
        displayName: Pack with Cake
        inputs:
          targetType: filePath
          filePath: ./build.ps1
          arguments: --target=CreatePackages
          errorActionPreference: stop
          pwsh: false

      # only after a successful pack, unlike the packages the symbols don't wait for the tests
      - task: PublishSymbols@2
        displayName: Publish symbols path
        inputs:
          SymbolsFolder: $(Build.SourcesDirectory)
          SearchPattern: '**/bin/**/*.pdb'
          # the task can't index GitHub sources ("Unsupported source provider 'GitHub'"),
          # the packages link their sources through SourceLink (PublishRepositoryUrl, EmbedUntrackedSources) instead
          IndexSources: false
          PublishSymbols: true
          SymbolServerType: TeamServices
          SymbolExpirationInDays: '36530'
          DetailedLog: true
          TreatNotIndexedAsWarning: false
          SymbolsArtifactName: Symbols_$(BuildConfiguration)

      - task: PublishPipelineArtifact@1
        displayName: Publish packages
        inputs:
          targetPath: packages
          artifact: NugetPackages
          publishLocation: pipeline

  # Native AOT on both operating systems, the native code and the libraries it links differ between them:
  # runs the tests of the AOT compatible packages as a native executable (MvvmScarletToolkit.Aot.Tests)
  # and publishes the Avalonia sample natively, failing on trim and AOT warnings of the native compiler.
  - job: Aot
    displayName: Native AOT
    strategy:
      matrix:
        Windows:
          vmImage: windows-latest
          rid: win-x64
        Linux:
          vmImage: ubuntu-latest
          rid: linux-x64
    pool:
      vmImage: $(vmImage)
    steps:
      # the packages compute their version from the history with Nerdbank.GitVersioning
      - checkout: self
        fetchDepth: 0
        fetchTags: true

      # see the Test job, one cache per operating system
      - task: Cache@2
        displayName: Cache NuGet packages
        inputs:
          key: 'nuget | "$(Agent.OS)" | Aot | Directory.Packages.props | global.json | **/*.csproj'
          restoreKeys: |
            nuget | "$(Agent.OS)" | Aot
          path: $(NUGET_PACKAGES)

      # Native AOT links against zlib on Linux, the hosted image lists clang but not the zlib headers
      - bash: dpkg -s zlib1g-dev > /dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y zlib1g-dev)
        displayName: Install zlib headers
        condition: and(succeeded(), eq(variables['Agent.OS'], 'Linux'))

      - pwsh: dotnet publish tests/MvvmScarletToolkit.Aot.Tests -c Release -r $(rid) -o "$(Agent.TempDirectory)/aot-tests"
        displayName: Publish AOT tests

      - pwsh: |
          $name = if ($IsWindows) { 'MvvmScarletToolkit.Aot.Tests.exe' } else { 'MvvmScarletToolkit.Aot.Tests' }
          & "$(Agent.TempDirectory)/aot-tests/$name" --progress off --results-directory "$(Agent.TempDirectory)/aot-results" --report-xunit-trx --report-xunit-trx-filename "aot-$(rid).trx"
        displayName: Run AOT tests

      # the run step already fails for failed tests, this only shows them in the Tests tab
      - task: PublishTestResults@2
        displayName: Publish AOT test results
        condition: succeededOrFailed()
        inputs:
          testRunner: VSTest
          testResultsFiles: '$(Agent.TempDirectory)/aot-results/*.trx'
          testRunTitle: Native AOT tests ($(rid))
          failTaskOnFailedTests: false
          failTaskOnMissingResultsFile: false

      # IlcTreatWarningsAsErrors only applies to the native compiler, not to the C# warnings of the build.
      # The symbol files are left out of the artifact, they are about 200 of its 260 MB
      - pwsh: |
          $output = "$(Build.ArtifactStagingDirectory)/avalonia-sample"
          dotnet publish samples/MvvmScarletToolkit.Avalonia.Samples -c Release -r $(rid) -o $output -p:IlcTreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem $output -Recurse -Include *.pdb, *.dbg | Remove-Item
        displayName: Publish Avalonia sample

      - task: PublishPipelineArtifact@1
        displayName: Publish sample artifact
        inputs:
          targetPath: $(Build.ArtifactStagingDirectory)/avalonia-sample
          artifact: AvaloniaSample-$(rid)
          publishLocation: pipeline

  # Pushes the packages of the Pack job, nothing is built here. Linux, because its agents start faster than the Windows ones.
  # Only possible because the Cake task PushNuget, which needs nuget.exe and therefore Windows, never runs in CI.
  # Waits for the AOT tests too, the packages claim to be Native AOT compatible.
  - job: Publish
    displayName: Publish
    dependsOn:
      - Test
      - Pack
      - Aot
    pool:
      vmImage: ubuntu-latest
    steps:
      # the Cake setup computes the version and branch from the history, even though it only pushes
      - checkout: self
        fetchDepth: 0
        fetchTags: true

      # see the Test job, here only the tools and the packages of the Cake build itself
      - task: Cache@2
        displayName: Cache NuGet packages
        inputs:
          key: 'nuget | "$(Agent.OS)" | Publish | Directory.Packages.props | .config/dotnet-tools.json | global.json | cake/Build.csproj'
          restoreKeys: |
            nuget | "$(Agent.OS)" | Publish
          path: $(NUGET_PACKAGES)

      - task: DownloadPipelineArtifact@2
        displayName: Download packages
        inputs:
          artifact: NugetPackages
          path: $(Build.SourcesDirectory)/packages

      # pushes to GitHub Packages. PushNuget is skipped, it needs PublicRelease and NUGETORG_APIKEY.
      # Through bash, the executable bit of build.sh is not tracked by git
      - task: Bash@3
        displayName: Push with Cake
        inputs:
          targetType: inline
          script: bash ./build.sh --target=PushPackages
          failOnStderr: false
        env:
          GITHUB_APIKEY: $(GITHUB_APIKEY)

      # NuGetCommand@2 runs nuget.exe, which needs Mono on Linux, and the Ubuntu 24.04 images no longer have it.
      # Unlike NuGetCommand, this task has no allowPackageConflicts: running this job again for the same build fails for packages
      # that already reached the feed. Every CI build has its own version, so only such a rerun is affected.
      - task: DotNetCoreCLI@2
        displayName: NuGet push to Azure
        inputs:
          command: push
          packagesToPush: 'packages/*.nupkg;!packages/*.symbols.nupkg'
          nuGetFeedType: internal
          # organization-scoped feed; a project-scoped one would be "<project>/<feed id>"
          publishVstsFeed: b2cb5bea-1571-49ae-a2b4-fc9709f5a4fe
          publishPackageMetadata: true
