# YAML version of the classic "MvvmScarletToolkit-CD" pipeline (definition 1, revision 59).
#
# Secrets are not stored here. They come from the variable group "MvvmScarletToolkit-Secrets"
# (Pipelines > Library), marked as secret, with this pipeline allowed under "Pipeline permissions":
#   NUGETORG_APIKEY  - push to nuget.org (PushNuget, only when PublicRelease is true), mapped in the Publish job
#   CODECOV_TOKEN    - coverage upload (UploadCodecovReport), mapped in the Test job
#   GITHUB_APIKEY    - push to GitHub Packages (PushGithub, only when PublicRelease is false), not mapped here
# Secret variables are not exposed to scripts automatically, so they are mapped through `env`.

trigger:
  batch: false
  branches:
    include:
      - master
  paths:
    exclude:
      - README.md
      - '*.md'

pr: none

variables:
  - group: MvvmScarletToolkit-Secrets
  - name: DOTNET_NOLOGO
    value: 'true'
  - name: DOTNET_CLI_TELEMETRY_OPTOUT
    value: 'true'
  - name: DOTNET_SKIP_FIRST_TIME_EXPERIENCE
    value: 'true'

# Same layout as ci.yaml: Test, Pack, the Native AOT jobs and the XAML format check run at the same time,
# from the templates in the pipelines folder. Publish only releases once all of them succeeded.
# Differences to CI: public release versions, symbols go to nuget.org as snupkg instead of the symbol server of Azure DevOps,
# Publish pushes to nuget.org instead of GitHub Packages and the Azure Artifacts feed, and creates a draft GitHub release.
# See ci.yaml for why there are no UseDotNet steps and why Cake starts directly.
jobs:
  - template: pipelines/test-job.yml
    parameters:
      publicRelease: true

  - template: pipelines/pack-job.yml
    parameters:
      publicRelease: true

  - template: pipelines/format-job.yml

  - template: pipelines/aot-job.yml

  # Pushes the packages of the Pack job to nuget.org, nothing is built here.
  # Windows, because the Cake task PushNuget pushes with nuget.exe, which Linux agents don't have.
  - job: Publish
    displayName: Publish
    dependsOn:
      - Test
      - Pack
      - Aot
      - Format
    pool:
      vmImage: windows-latest
    steps:
      # the Cake setup computes the version and branch from the history, even though it only pushes
      - checkout: self
        fetchDepth: 0
        fetchTags: true

      - task: DownloadPipelineArtifact@2
        displayName: Download packages
        inputs:
          artifact: NugetPackages
          path: $(Build.SourcesDirectory)/packages

      # pushes the packages and their snupkg to nuget.org. PushGithub is skipped, it only runs for pre-releases.
      - pwsh: dotnet run --project cake/Build.csproj -- --target=PushPackages
        displayName: Push with Cake
        env:
          PublicRelease: true
          NUGETORG_APIKEY: $(NUGETORG_APIKEY)

      # Replaces the classic release pipeline "Release to github" (release definition 1).
      # Only creates a draft when the built commit carries a git tag (e.g. 5.0.96), otherwise the task
      # succeeds with "Release will not be created as the tags for the target commit do not match".
      - task: GitHubRelease@1
        displayName: GitHub release (create)
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
        inputs:
          # GitHub service connection of the classic release pipeline, by id;
          # its name works too. The pipeline has to be allowed to use it on the first run.
          gitHubConnection: 13bc84df-9fb7-41dd-b04b-9a8b9e05db90
          repositoryName: $(Build.Repository.Name)
          action: create
          target: $(Build.SourceVersion)
          tagSource: gitTag
          isDraft: true
          isPreRelease: false
          # the classic release pointed at an empty folder and never attached files
          assets: |
            packages/*.nupkg
            packages/*.snupkg
          assetUploadMode: delete
          addChangeLog: true
          changeLogCompareToRelease: lastFullRelease
          changeLogType: commitBased
          changeLogLabels: '[{ "label" : "bug", "displayName" : "Bugs", "state" : "closed" }]'
          releaseNotesSource: inline
          releaseNotesInline: |
            NuGet packages for this release:

            ## general purpose

            [MvvmScarletToolkit](https://www.nuget.org/packages/MvvmScarletToolkit/)
            [MvvmScarletToolkit.Commands](https://www.nuget.org/packages/MvvmScarletToolkit.Commands/)
            [MvvmScarletToolkit.Observables](https://www.nuget.org/packages/MvvmScarletToolkit.Observables/)
            [MvvmScarletToolkit.ImageLoading](https://www.nuget.org/packages/MvvmScarletToolkit.ImageLoading/)
            [MvvmScarletToolkit.Mediator ](https://www.nuget.org/packages/MvvmScarletToolkit.Mediator/)
            [MvvmScarletToolkit.Messenger](https://www.nuget.org/packages/MvvmScarletToolkit.Messenger/)

            ## framework specific

            [MvvmScarletToolkit.Wpf](https://www.nuget.org/packages/MvvmScarletToolkit.Wpf/)
            [MvvmScarletToolkit.Avalonia](https://www.nuget.org/packages/MvvmScarletToolkit.Avalonia/)

            ## interfaces and models

            [MvvmScarletToolkit.Abstractions](https://www.nuget.org/packages/MvvmScarletToolkit.Abstractions/)
